name: Build Native Kotlin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify native project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/quantdesk/sachinvs3/MainActivity.kt
          test ! -f pubspec.yaml
          test ! -f lib/main.dart

      - name: Run Kotlin unit tests
        run: gradle test

      - name: Android lint
        run: gradle lint

      - name: Build release APK
        run: gradle assembleRelease

      - name: Verify APK artifact
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sachinvs3-native-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
